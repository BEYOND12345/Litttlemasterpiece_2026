<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudinary Public ID Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8">
    <h1 class="text-3xl font-bold mb-6">Find Correct Cloudinary Public IDs</h1>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
      <h2 class="font-bold text-blue-900 mb-2">How to use:</h2>
      <ol class="list-decimal list-inside space-y-1 text-sm text-blue-800">
        <li>Enter your Cloudinary cloud name below</li>
        <li>Enter different public ID variations to test</li>
        <li>If the image loads, you found the correct public ID!</li>
        <li>Update your database with the working public ID</li>
      </ol>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium mb-2">Cloudinary Cloud Name</label>
      <input
        type="text"
        id="cloudName"
        placeholder="dwgkdvugh"
        class="w-full px-3 py-2 border rounded-lg"
      />
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium mb-2">Public ID to Test</label>
      <input
        type="text"
        id="publicId"
        placeholder="Try: mockups/Mockup_phonecase_01, mockups/phone_case_mockup, etc."
        class="w-full px-3 py-2 border rounded-lg"
      />
      <button
        onclick="testPublicId()"
        class="mt-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
      >
        Test This Public ID
      </button>
    </div>

    <div class="mb-6">
      <h3 class="font-bold mb-3">Common Variations to Try:</h3>
      <div class="space-y-2">
        <button onclick="quickTest('mockups/Mockup_phonecase_01')" class="block w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded border text-sm">
          mockups/Mockup_phonecase_01
        </button>
        <button onclick="quickTest('mockups/Mockup_Totebag_01')" class="block w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded border text-sm">
          mockups/Mockup_Totebag_01
        </button>
        <button onclick="quickTest('mockups/Mockup_card_01')" class="block w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded border text-sm">
          mockups/Mockup_card_01
        </button>
        <button onclick="quickTest('mockups/Mockup_LargeFrame_01')" class="block w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded border text-sm">
          mockups/Mockup_LargeFrame_01
        </button>
        <button onclick="quickTest('mockups/Mockup_Tshirt_01')" class="block w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded border text-sm">
          mockups/Mockup_Tshirt_01
        </button>
        <button onclick="quickTest('mockups/Mockup_Coffecup_01')" class="block w-full text-left px-3 py-2 bg-gray-50 hover:bg-gray-100 rounded border text-sm">
          mockups/Mockup_Coffecup_01
        </button>
      </div>
    </div>

    <div id="result" class="mt-6"></div>
  </div>

  <script>
    function getCloudName() {
      return document.getElementById('cloudName').value || 'dwgkdvugh';
    }

    function quickTest(publicId) {
      document.getElementById('publicId').value = publicId;
      testPublicId();
    }

    function testPublicId() {
      const cloudName = getCloudName();
      const publicId = document.getElementById('publicId').value.trim();
      const resultDiv = document.getElementById('result');

      if (!publicId) {
        resultDiv.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Please enter a public ID to test</div>';
        return;
      }

      resultDiv.innerHTML = '<div class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded">Testing... Please wait</div>';

      const testUrl = `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto:good,w_600/${publicId}`;

      const img = new Image();
      let loadStatus = 'pending';

      img.onload = function() {
        loadStatus = 'success';
        resultDiv.innerHTML = `
          <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
            <div class="font-bold mb-2">✓ SUCCESS! This public ID works!</div>
            <div class="text-sm mb-2">Public ID: <code class="bg-white px-2 py-1 rounded">${publicId}</code></div>
            <div class="text-sm mb-2">Update your database with this exact public ID</div>
            <img src="${testUrl}" class="mt-4 max-w-full rounded-lg shadow-lg" alt="Test mockup">
            <div class="mt-4 text-xs text-gray-600">Full URL: ${testUrl}</div>
          </div>
        `;
      };

      img.onerror = function() {
        loadStatus = 'error';
        resultDiv.innerHTML = `
          <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
            <div class="font-bold mb-2">✗ Failed - This public ID doesn't work</div>
            <div class="text-sm mb-2">Tried: <code class="bg-white px-2 py-1 rounded">${publicId}</code></div>
            <div class="text-sm">Try a different variation or check your Cloudinary console for the exact public ID</div>
            <div class="mt-4 text-xs text-gray-600">Attempted URL: ${testUrl}</div>
          </div>
        `;
      };

      img.src = testUrl;

      setTimeout(() => {
        if (loadStatus === 'pending') {
          resultDiv.innerHTML = `
            <div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">
              <div class="font-bold mb-2">⏱ Timeout - Image took too long to load</div>
              <div class="text-sm">The public ID might be incorrect, or the image is very large</div>
            </div>
          `;
        }
      }, 10000);
    }
  </script>
</body>
</html>
